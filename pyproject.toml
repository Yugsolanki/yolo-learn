[project]
name = "yolo-learn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yug Solanki", email = "yugsolanki15@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "ultralytics>=8.4.154",
    "torch",
    "torchvision",
    "roboflow>=1.3.13",
    "python-dotenv>=1.2.3",
]

[project.scripts]
yolo-learn = "yolo_learn:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }
